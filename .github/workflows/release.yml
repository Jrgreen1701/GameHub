name: Build Windows installer and publish release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build application
        shell: cmd
        run: cd GameHub && call build_exe.bat
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Compile installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Generate checksum
        shell: powershell
        run: |
          $file = Get-ChildItem output\GameHub_Setup_v*.exe | Select-Object -First 1
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Set-Content -Encoding ascii output\SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: gh release create "${{ github.ref_name }}" output\GameHub_Setup_v*.exe output\SHA256SUMS.txt --generate-notes --verify-tag
